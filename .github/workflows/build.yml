name: Build

on:
  workflow_dispatch:
  push:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Checkout native dependencies
        run: |
          git submodule update --init core/src/main/cpp/xz core/src/main/cpp/lsplant
          git -C core/src/main/cpp/lsplant submodule update --init --recursive lsplant/src/main/jni/external/dex_builder

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.0

      - name: Build
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          
          rm -rf $ANDROID_HOME/cmake
          ./gradlew :core:publishToMavenLocal :core:assembleDebugAndroidTest :example:assembleDebug

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: Aliuhook-api37
          path: core/build/outputs/aar/core-release.aar

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: Aliuhook-test-apks
          path: |
            core/build/outputs/apk/androidTest/debug/*.apk
            example/build/outputs/apk/debug/*.apk
